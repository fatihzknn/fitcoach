services:
  db:
    image: postgres:16-alpine
    container_name: fitcoach-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitcoach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitcoach}
      POSTGRES_DB: ${POSTGRES_DB:-fitcoach}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fitcoach_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitcoach} -d ${POSTGRES_DB:-fitcoach}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional lightweight DB UI. Start with: docker compose up adminer
  adminer:
    image: adminer:4
    container_name: fitcoach-adminer
    profiles: ["tools"]
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  fitcoach_pgdata:
